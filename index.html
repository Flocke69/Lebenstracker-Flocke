<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover, damit die Tab-Bar bis unter den Home-Indicator reicht -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lebenstracker</title>
  <meta name="description" content="Trainings-, Gewichts- und Ernährungstracker für Fußball plus Krafttraining.">
  <meta name="theme-color" content="#0C120F">

  <!-- Als App vom Home-Bildschirm starten -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">

  <!-- Schriften liegen im Repo, damit zur Laufzeit nichts nachgeladen wird -->
  <link rel="preload" href="fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-condensed-600-latin.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Hell oder dunkel VOR dem ersten Bild setzen. Läuft das erst im Modul,
       blitzt beim Start eine Zehntelsekunde die falsche Palette auf — auf
       einem hellen Screen ist das ein schwarzer Blitz ins Gesicht.
       Die Logik dazu steht in js/views/theme.js; hier nur der Vorgriff. -->
  <script>
    try {
      var t = localStorage.getItem('lebenstracker.theme');
    } catch (e) { /* privater Modus */ }
    document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t
      : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  </script>
</head>
<body>
  <div id="app" class="app app--onboarding">
    <main class="viewport">
      <div class="view">
        <p class="field__hint">Lädt …</p>
      </div>
    </main>
  </div>

  <noscript>
    <div class="view">
      <div class="notice notice--error">
        <span class="notice__title">JavaScript ist ausgeschaltet</span>
        Die App rechnet alles lokal im Browser und braucht dafür JavaScript.
      </div>
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
