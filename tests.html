<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lebenstracker — Tests</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body { padding: var(--space-5); max-width: 52rem; margin: 0 auto; }

    .page-head { margin-bottom: var(--space-6); }
    .page-head h1 { font-size: var(--text-xl); }
    .page-head p { color: var(--ink-muted); font-size: var(--text-sm); margin-top: var(--space-2); }

    .summary {
      display: flex; align-items: baseline; gap: var(--space-3);
      padding: var(--space-4) var(--space-5);
      border-radius: var(--radius-lg);
      background: var(--surface);
      border: 1px solid var(--line-200);
      margin-bottom: var(--space-6);
    }
    .summary__num {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      line-height: var(--leading-tight);
      font-variant-numeric: tabular-nums;
    }
    .summary__label { font-size: var(--text-sm); color: var(--ink-muted); }
    .summary--pass .summary__num { color: var(--chalk-100); }
    .summary--fail .summary__num { color: var(--redcard-500); }
    .summary--fail .summary__label { color: var(--redcard-500); }

    .suite {
      background: var(--surface);
      border: 1px solid var(--line-200);
      border-radius: var(--radius-md);
      padding: var(--space-4) var(--space-5);
      margin-bottom: var(--space-4);
    }
    .suite--failed { border-color: var(--redcard-500); }
    .suite h2 {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: var(--space-4); font-size: var(--text-lg);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--line-200);
    }
    .suite__count {
      font-family: var(--font-body); font-size: var(--text-xs);
      font-weight: 600; text-transform: uppercase;
      letter-spacing: var(--track-wide); color: var(--ink-muted);
      white-space: nowrap;
    }
    .suite--failed .suite__count { color: var(--redcard-500); }

    .cases { list-style: none; margin: 0; padding: 0; }
    .case {
      padding: var(--space-2) 0 var(--space-2) var(--space-5);
      position: relative; font-size: var(--text-sm);
      border-bottom: 1px solid var(--line-200);
    }
    .case:last-child { border-bottom: 0; }
    /* Marke statt Farbe allein: Häkchen bzw. Kreuz */
    .case::before {
      position: absolute; left: 0; top: var(--space-2);
      font-weight: 600;
    }
    .case--pass::before { content: '✓'; color: var(--data-500); }
    .case--fail::before { content: '✕'; color: var(--redcard-500); }
    .case--pass .case__name { color: var(--ink-muted); }
    .case--fail .case__name { color: var(--ink); font-weight: 600; }

    .case__error {
      margin: var(--space-2) 0 var(--space-1);
      padding: var(--space-3);
      background: var(--pitch-900);
      border-left: 2px solid var(--redcard-500);
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap; overflow-x: auto; color: var(--ink);
    }

    .loading { color: var(--ink-muted); font-size: var(--text-sm); }
  </style>
</head>
<body>
  <div class="page-head">
    <h1>Lebenstracker — Tests</h1>
    <p>
      Geprüft wird ausschließlich <code>js/lib/</code> — reine Rechenlogik ohne
      DOM. Es gibt kein node in dieser Umgebung, deshalb läuft der Runner im
      Browser. Start über <code>python3 -m http.server 8080</code>.
    </p>
  </div>

  <div id="out" class="loading">Tests laufen …</div>

  <script type="module">
    const out = document.getElementById('out');

    // Jede neue Testdatei hier eintragen.
    const files = [
      '/tests/dates.test.js',
      '/tests/energy.test.js',
      '/tests/planner.test.js',
      '/tests/state.test.js',
      '/tests/readiness.test.js',
      '/tests/input.test.js',
      '/tests/volume.test.js',
      '/tests/aggregate.test.js',
      '/tests/review.test.js',
      '/tests/archive.test.js',
    ];

    /* Beim Entwickeln muss jeder Lauf die aktuellen Dateien sehen.
     *
     * Browser halten ES-Module fest, teils prozessweit und ohne Rücksicht auf
     * `Cache-Control: no-store`. Eine Kennung an der Adresse reicht nicht:
     * relative Importe erben sie nicht, `../js/lib/state.js` gegen
     * `/tests/x.test.js?t=1` ergibt wieder die Adresse ohne Kennung — die
     * Testdatei wäre frisch, die geprüfte Datei nicht.
     *
     * Ein PFAD-Präfix wird dagegen mitgeführt. tools/serve.py schneidet
     * `/v/<zahl>/` wieder ab. Auf GitHub Pages gibt es das nicht, dort wird
     * ganz normal geladen.
     */
    const IS_LOCAL = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
    const prefix = IS_LOCAL ? `/v/${Date.now()}` : '.';

    try {
      // Das Harness MUSS über dasselbe Präfix kommen — sonst registrieren die
      // Testdateien ihre Fälle in einer zweiten, unabhängigen Instanz und der
      // Bericht bliebe leer.
      const { report } = await import(`${prefix}/tests/harness.js`);
      // Reihenfolge beibehalten, damit der Bericht stabil bleibt.
      for (const f of files) await import(prefix + f);
      out.className = '';
      report(out);
    } catch (err) {
      out.className = '';
      out.innerHTML =
        '<div class="summary summary--fail">' +
        '<span class="summary__num">!</span>' +
        '<span class="summary__label">Testdateien konnten nicht geladen werden</span>' +
        '</div>';
      const pre = document.createElement('pre');
      pre.className = 'case__error';
      pre.textContent = `${err.name}: ${err.message}\n\n${err.stack ?? ''}`;
      out.appendChild(pre);
      window.__testResult = { total: 0, failed: 1, passed: 0, loadError: String(err) };
    }
  </script>
</body>
</html>
