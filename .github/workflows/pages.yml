# Veröffentlicht die App auf GitHub Pages — bei jedem Push auf main.
#
# `enablement: true` schaltet Pages beim ersten Lauf selbst ein, damit dafür
# niemand in die Repository-Einstellungen muss.
#
# Es wird nichts gebaut: die App ist reines HTML, CSS und ES-Module ohne
# Build-Schritt. Der Workflow lädt das Verzeichnis hoch und stellt es bereit.

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Deployments gleichzeitig, aber laufende auch nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auschecken
        uses: actions/checkout@v4

      - name: Pages einrichten (und beim ersten Mal aktivieren)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verzeichnis hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Bereitstellen
        id: deployment
        uses: actions/deploy-pages@v4
